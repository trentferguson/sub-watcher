<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Subreddit Watcher – Config Editor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 20px;
            background: #0f172a;
            color: #e5e7eb;
        }

        h1 {
            margin-bottom: 0.4rem;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #9ca3af;
        }

        .messages {
            margin-bottom: 1rem;
        }

        .msg-success {
            padding: 8px 10px;
            border-radius: 4px;
            background: #065f46;
            color: #bbf7d0;
            margin-bottom: 0.5rem;
        }

        .msg-error {
            padding: 8px 10px;
            border-radius: 4px;
            background: #7f1d1d;
            color: #fecaca;
            margin-bottom: 0.5rem;
            white-space: pre-wrap;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            background: #020617;
            color: #e5e7eb;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.9rem;
        }

        button {
            margin-top: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover {
            background: #1d4ed8;
        }

        a {
            color: #93c5fd;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .top-links {
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="top-links">
        <a href="/">← Back to Dashboard</a>
    </div>

    <h1>Config Editor</h1>
    <p class="subtitle">
        Editing <code>{{ config_path }}</code>. Changes take effect the next time the watcher loop runs.
    </p>

    <div class="messages">
        {% if success %}
        <div class="msg-success">{{ success }}</div>
        {% endif %}
        {% if error %}
        <div class="msg-error">{{ error }}</div>
        {% endif %}
    </div>

    <form method="post">
        <textarea name="content">{{- content -}}</textarea>
        <br>
        <button type="submit">Save Config</button>
    </form>
</body>

</html>
